services:
  qrhunt:
    build:
      context: .
      args:
        VITE_APP_GOOGLE_API_KEY: ${VITE_APP_GOOGLE_API_KEY:-}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:password@host.docker.internal:5432/qrhunt
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
